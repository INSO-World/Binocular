name: Test Backend CI (fast)

on:
  push:
    paths:
      - '.github/workflows/backend-fast.yml'
      - 'binocular-backend-new/**'
      - '!binocular-backend-new/ffi/lib/**'
  #  pull_request:
  #    branches:
  #      - "!main"
  #      - "!develop"
  workflow_dispatch:

env:
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true'
  WD: binocular-backend-new
  JAVA_VERSION: '23'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Lint (ktlint)
        run: mvn $MAVEN_CLI_OPTS ktlint:check

  build:
    name: Build (install once)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Install (whole reactor, skip tests)
        run: mvn $MAVEN_CLI_OPTS clean install -DskipTests

  test-modules:
    name: Test Modules
    needs:
      - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    strategy:
      fail-fast: false
      matrix:
        MODULE: [
          { name: 'domain' },
          { name: 'core' },
          { name: 'ffi' },
          { name: 'jgit' },
          { name: 'github' },
          { name: 'infrastructure-arangodb' },
          { name: 'infrastructure-sql' },
          { name: 'infrastructure-test', springProfile: 'test,gix,arangodb' },
          { name: 'infrastructure-test', springProfile: 'test,gix,postgres' },
          { name: 'integration-test/vcs-indexer', springProfile: 'jgit' },
          { name: 'integration-test/vcs-indexer', springProfile: 'gix' }
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Run tests for module ${{ matrix.MODULE.name }}
        run: |
          CMD="mvn $MAVEN_CLI_OPTS test -o --pl ${{ matrix.MODULE.name }}"
          if [ -n "${{ matrix.MODULE.springProfile }}" ]; then
            CMD="$CMD -Dspring.profiles.active=${{ matrix.MODULE.springProfile }}"
          fi
          echo "Running: $CMD"
          eval $CMD

      - name: Surefire report for module ${{ matrix.MODULE.name }}
        if: always()
        run: |
          SAFE_NAME=$(echo "${{ matrix.MODULE.name }}" | tr '/' '-')
          CMD="mvn $MAVEN_CLI_OPTS surefire-report:report-only -o --pl ${{ matrix.MODULE.name }}"
          if [ -n "${{ matrix.MODULE.springProfile }}" ]; then
            CMD="$CMD -Dspring.profiles.active=${{ matrix.MODULE.springProfile }}"
          fi
          eval $CMD

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_MODULE_NAME }}-${{ matrix.MODULE.springProfile }}-report
          path: ${{ env.WD }}/${{ matrix.MODULE.name }}/target/reports/

  test-application-postgres:
    name: Test-Application Layers w/ postgres
    needs:
      - build
      - test-modules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    strategy:
      fail-fast: false
      matrix:
        module: [ 'cli' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Run tests for module ${{ matrix.module }}
        run: |
          mvn $MAVEN_CLI_OPTS test -o --pl ${{ matrix.module }} -Dspring.profiles.active=test,postgres

      - name: Surefire report for module ${{ matrix.module }}
        if: always()
        run: mvn $MAVEN_CLI_OPTS surefire-report:report-only -o --pl ${{ matrix.module }}

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-report-postgres
          path: ${{ env.WD }}/${{ matrix.module }}/target/reports/

  test-application-arangodb:
    name: Test-Application Layers w/ ArangoDB
    needs:
      - build
      - test-modules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    strategy:
      fail-fast: false
      matrix:
        module: [ 'web' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Run tests for module ${{ matrix.module }}
        run: |
          mvn $MAVEN_CLI_OPTS test -o --pl ${{ matrix.module }} -Dspring.profiles.active=test,arangodb

      - name: Surefire report for module ${{ matrix.module }}
        if: always()
        run: mvn $MAVEN_CLI_OPTS surefire-report:report-only -o --pl ${{ matrix.module }}

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-report-arangodb
          path: ${{ env.WD }}/${{ matrix.module }}/target/reports/

  test-graphql-realdata:
    name: Test-GraphQL Real Data Integration
    needs:
      - build
      - test-modules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (cache/java/go-offline)
        uses: ./.github/actions/java-maven-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          working-directory: ${{ env.WD }}
          checkout-depth: 1

      - name: Run GraphQL Real-Data Tests
        run: |
          mvn $MAVEN_CLI_OPTS test -o --pl web -Dspring.profiles.active=test,nosql,arangodb -Dtest=*RealDataIT

      - name: Surefire report for GraphQL Real-Data Tests
        if: always()
        run: |
          mvn $MAVEN_CLI_OPTS surefire-report:report-only -o --pl web -Dspring.profiles.active=test,nosql,arangodb -Dtest=*RealDataIT

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-graphql-realdata-report
          path: ${{ env.WD }}/web/target/reports/
