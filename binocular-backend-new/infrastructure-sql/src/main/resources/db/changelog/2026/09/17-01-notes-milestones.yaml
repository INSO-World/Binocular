                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: platform_iid
                  type: INT
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: VARCHAR(255)
              - column:
                  name: start_date
                  type: VARCHAR(255)
              - column:
                  name: due_date
                  type: VARCHAR(255)
              - column:
                  name: state
                  type: VARCHAR(255)
              - column:
                  name: expired
                  type: BOOLEAN
              - column:
                  name: web_url
                  type: VARCHAR(255)
        - createSequence:
            sequenceName: milestones_seq
            startValue: 1
            incrementBy: 50

  - changeSet:
      id: 2026-09-17-03-create-note-connections
      author: Markus
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: note_account_connections
      changes:
        - createTable:
            tableName: note_account_connections
            columns:
              - column:
                  name: note_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: note_account_connections
            columnNames: note_id, account_id
            constraintName: pk_note_account_connections
        - addForeignKeyConstraint:
            baseTableName: note_account_connections
            baseColumnNames: note_id
            referencedTableName: notes
            referencedColumnNames: id
            constraintName: fk_note_account_note
        - addForeignKeyConstraint:
            baseTableName: note_account_connections
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_note_account_account

