databaseChangeLog:
  - changeSet:
      id: 2026-09-17-01-create-notes
      author: Markus
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: notes
      changes:
        - createTable:
            tableName: notes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_notes
              - column:
                  name: iid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: body
                  type: TEXT
              - column:
                  name: created_at
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: VARCHAR(255)
              - column:
                  name: system
                  type: BOOLEAN
              - column:
                  name: resolvable
                  type: BOOLEAN
              - column:
                  name: confidential
                  type: BOOLEAN
              - column:
                  name: internal
                  type: BOOLEAN
              - column:
                  name: imported
                  type: BOOLEAN
              - column:
                  name: imported_from
                  type: VARCHAR(255)
        - createSequence:
            sequenceName: notes_seq
            startValue: 1
            incrementBy: 50

