x-binocular-backend-image: &binocular-backend-image ghcr.io/inso-world/binocular-backend:${TAG:-latest} #:${TAG:-latest-dev}
x-binocular-db-image: &binocular-db-image arangodb:3.12 #ghcr.io/inso-world/binocular-database:6773404196 #:${TAG:-latest-dev}
x-binocular-frontend-image: &binocular-frontend-image ghcr.io/inso-world/binocular-frontend:${TAG:-latest}
x-binocular-volumes-backend: &binocular-volumes-backend
  - "${REPO_PATH:-./}:/app/binocular/${REPO_NAME:-repo}"
x-binocular-build-args: &binocular-build-args
  NODE_VERSION: "22.21.1" # check if same as in .nvmrc!

networks:
  binocular:

services:
  db:
    image: *binocular-db-image
    container_name: binocular_db
    restart: unless-stopped
    environment:
      ARANGO_NO_AUTH: 1
    ports:
      - "8529:8529"
    networks:
      - binocular
    volumes:
      - ./docker/arangodb/data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-qO", "/dev/null", "http://127.0.0.1:8529/_api/version"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  binocular-init:
    image: *binocular-backend-image
    depends_on:
      db:
        condition: service_healthy
    container_name: "binocular_init"
    working_dir: "/app/binocular/backend"
    entrypoint: ["/bin/sh"]
    environment:
      - DEBUG=idx*,importer*,git*,db*,context*
      # Override arango host to Docker service name (rc env vars take highest priority)
      - binocular_arango__host=db
    # To skip indexers add flags: --no-vcs --no-ci --no-its --no-jobs
    # To truncate all documents add: --clean
    command:
      - "-c"
      - |
        git config --global --add safe.directory /app/binocular/${REPO_NAME:-repo}
        binocular run --no-server /app/binocular/${REPO_NAME:-repo}/
    volumes: *binocular-volumes-backend
    networks:
      - binocular
    build:
      context: ./
      dockerfile: docker/backend.Dockerfile
      args: *binocular-build-args

  binocular-backend:
    image: *binocular-backend-image
    depends_on:
      db:
        condition: service_healthy
      binocular-init:
        condition: service_completed_successfully
    container_name: "binocular_backend"
    working_dir: "/app/binocular/backend"
    entrypoint: ["/bin/sh"]
    tty: true
    environment:
      - DEBUG=idx*,importer*,git*,db*,context*
      # Override arango host to Docker service name (rc env vars take highest priority)
      - binocular_arango__host=db
    command:
      - "-c"
      - |
        git config --global --add safe.directory /app/binocular/${REPO_NAME:-repo}
        binocular run --no-vcs --no-ci --no-its --no-jobs /app/binocular/${REPO_NAME:-repo}/
    ports:
      - "8080:8080"
      - "48763:48763"
    build:
      context: ./
      dockerfile: docker/backend.Dockerfile
      args: *binocular-build-args
    volumes: *binocular-volumes-backend
    networks:
      - binocular

  binocular:
    container_name: binocular_app
    image: *binocular-frontend-image
    ports:
      - 8088:80
    networks:
      - binocular
    volumes:
      - "./nginx/nginx.conf://etc/nginx/nginx.conf:ro"
    # command: [nginx-debug, '-g', 'daemon off;']
    # entrypoint: [""]
    depends_on:
      - binocular-backend
    environment:
      - SERVER_NAME=localhost
      - HOST=127.0.0.1
      - PORT=80
    build:
        context: ./
        dockerfile: docker/frontend.v2.Dockerfile
        args: *binocular-build-args
